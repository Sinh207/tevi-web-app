<!--
  Glyphs the Tevi Figma icon library does not contain, taken from the same upstream set
  it was built from: Zappicon v1.2.0 (`@zappicon/react@1.2.0`, `dist/esm/variants/`).

  This file exists so those glyphs survive a re-export. `tevi-icons.svg` is a pristine
  Figma export and is overwritten wholesale; anything added there is gone on the next
  export. `pnpm icons` merges this file over it, so the two stay separable and the
  provenance of every glyph here stays legible.

  Rules for adding one:
    - Upstream Zappicon only. Do not hand-draw a path and do not adapt a different glyph
      into the shape you want — see docs/DESIGN_SYSTEM.md §7.
    - Same weights as the glyph it partners with, so the generated name unions stay honest
      (`eye` is filled-only, so `eye-slash` is too).
    - Delete the entry the moment Figma ships the glyph — `icon-names.test.ts` fails on any id
      that exists in both files, so a duplicate cannot sit here unnoticed.

  envelope — the two email steps of `/settings/two-step-verification` draw one, and so does the
  recovery step of the withdrawal passcode dialog. Verified against the comps: Figma
  `Two-step verification` node `1070:94156` is a rounded open-flap envelope, which is this glyph.
  The Tevi library ships no envelope, no `mail` and no `letter` — three screens had been standing in
  `send` ("a code was sent"), which says the wrong half of the sentence: the step is about *where to
  go and look*, not about the sending.
  Filled only, aliased the way the sprite's own 65 bare ids are, because that is the weight the
  56px step marks draw.

  microphone-slash — the seat tiles in the Live studio show whether a co-host's microphone is open,
  and that is a two-state indicator one glyph cannot express. The Tevi library ships `microphone`
  (regular + filled, bare aliased onto regular) and no counterpart. Upstream name matches, so no
  rename was needed — unlike `heart-slash` above.
  Provenance checked the way that entry describes: the library's `microphone--filled` is upstream's
  `microphone` filled, same coordinates (12 1.25 / 4.75 / 7.25 6, then 5.75 12 / 19.7142), with
  Figma's absolute re-serialisation against the npm build's relative one.
  Both weights and the bare alias, matching the partner glyph exactly.

  face-smile — the Live studio's chat composer has an emoji button, and a face is the only thing
  that says "emoji". The Tevi library ships no smiley of any kind: no `face`, no `smile`, no
  `emoji`, no `mood` (checked against all 557 glyphs). Upstream name matches, so no rename.
  ⚠ Note what this button opens: **not** a full picker. `emoji-picker-react`, which legacy mounts,
  is 40MB unpacked, so `EmojiRow` draws a curated grid of native characters instead — the glyph is
  the affordance, the dependency is not worth it. That divergence is argued at the component.
  Both weights and the bare alias, matching how the library ships its other two-state glyphs.

  eye-slash — the reveal toggle in `features/auth/components/auth-fields.tsx` needs two
  states. The library drew `eye` (filled only) and no counterpart, and in the sprite the
  bare `eye` is an alias onto `eye--filled`, so a weight toggle drew the same glyph twice.
  Verified against `bell-slash` / `comment-slash`: same 45° corner-to-corner bar, same
  0.75-radius caps, same knockout gap.
  heart-slash — the space menu's Follow / Unfollow row (`channel-viewer-menu.tsx`) is a two-state
  toggle and the library draws only the positive half. Its neighbour in the same popup is
  `bell` / `bell-slash`, so the row reads wrong without the matching pair.
  Upstream name is **`heart-simple-slash`**, renamed here to `heart-slash` because the Figma library
  ships upstream's `heart-simple` as plain `heart` — same drawing, verified by the coordinates the
  two share (1.25 / 9.474 / 6.643 / 7.224 in `regular`, 1.5 / 9.474 / 7.893 in `filled`); Figma
  re-serialises absolute where the npm build is relative, which is why a byte comparison fails and a
  numeric one does not. Keeping upstream's longer name would have left the sprite with `heart` and
  `heart-simple-slash` as a pair, which reads as two different families.
  Regular **and** filled, matching the weights `heart` itself carries, with the bare id aliased onto
  `--regular` — which is what the library's own `heart` does (`bell-slash` and `comment-slash` alias
  onto `--filled`, so the alias target is per-glyph and copied from the partner, not assumed).
-->
