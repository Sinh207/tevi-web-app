name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

# A new push to the same branch makes the run in flight irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same four commands as the pre-PR gate in
      # `.github/pull_request_template.md`. `--if-present` is deliberately not
      # used: a script disappearing should fail the build, not skip silently.
      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm lint:rtl

      # Before `pnpm test`, deliberately: the grammar linter is the cheap, unambiguous
      # check, and the catalog-drift test inside `pnpm test` writes a message that assumes
      # the ids are already well-formed. Report the typo before the drift it caused.
      - run: pnpm lint:testids

      - run: pnpm test

  # `next build` is pinned to webpack and is far slower than the checks above, so
  # it runs as its own job rather than holding up the fast feedback.
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # `env.ts` warns rather than throws on invalid env so a build can proceed,
      # which means missing NEXT_PUBLIC_* values would sail through here and only
      # surface at runtime. These are the placeholder values from
      # `.env.local.example`, enough to exercise the real code paths.
      - run: pnpm build
        env:
          NEXT_PUBLIC_ENV: development
          NEXT_PUBLIC_BASE_URL: https://tevi.dev
          NEXT_PUBLIC_W_API_DOMAIN: https://wapi.tevi.dev
          NEXT_PUBLIC_DOORMAN_DOMAIN: https://doorman.tevi.dev
          NEXT_PUBLIC_SIGN_SECRET: ci-placeholder
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder

  # Playwright covers what Vitest structurally cannot: a real server render, a real
  # HTTP status code, and a browser. (Vitest does render components where the
  # assertion needs the tree — it is the *server* half it cannot reach.) It builds
  # and starts the app itself — see `playwright.config.ts`, which uses
  # `next build && next start` rather than `next dev` because `generateMetadata`,
  # ISR and real 404s only behave correctly in a production build.
  #
  # The spec-count guard that used to sit here is gone: `e2e/` holds specs now, so
  # the condition was always true and only read as though the job might skip.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test:e2e
        env:
          NEXT_PUBLIC_ENV: development
          # A runner is outside the cluster: the server's metadata reads go through the public
          # gateway instead of the in-cluster services (`shared/config/server-env.ts`).
          SERVER_API_VIA_GATEWAY: '1'
          NEXT_PUBLIC_BASE_URL: https://tevi.dev
          NEXT_PUBLIC_W_API_DOMAIN: https://wapi.tevi.dev
          NEXT_PUBLIC_DOORMAN_DOMAIN: https://doorman.tevi.dev
          NEXT_PUBLIC_SIGN_SECRET: ci-placeholder
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-placeholder
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-placeholder
          NEXT_PUBLIC_FIREBASE_APP_ID: ci-placeholder

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
